<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروستکەری وێب | Kurd Technology</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ai-builder.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
</head>
<body>
<header class="top">
  <a class="back" href="services.html" aria-label="گەڕانەوە">‹</a>
  <b class="ttl">دروستکەری وێب</b>
  <span class="quota" id="quota"></span>
  <button class="adm" id="adminBtn" type="button" hidden>⭐ ئەدمین</button>
  <button class="ib" id="themeBtn" type="button" aria-label="theme">◐</button>
</header>

<main>
  <!-- HOME -->
  <section id="home">
    <h1>وێبسایتەکەت بە ئاسانی دروست بکە</h1>
    <p class="sub">وەسفێکی کورت بنووسە بۆ ئەوەی ژێرەوە دروستکرد.</p>
    <div class="box">
      <textarea id="prompt" maxlength="2000" placeholder="وەسفی وێبسایتەکەت بکە... (نموونە: فرۆشگای جلی ژنان، ٥ بەرهەم، دیزاینی تاریک)"></textarea>
      <button class="go" id="goBtn" type="button">ناردن ➤</button>
    </div>
    <h2>پڕۆژەکانم</h2>
    <div id="projects" class="grid"></div>
  </section>

  <!-- WORKSPACE -->
  <section id="work" hidden>
    <div class="tabs">
      <button class="tab on" data-t="chat" type="button">چاتی من و ئەی ئای</button>
      <button class="tab" data-t="view" type="button">بینینی ماڵپەڕ</button>
    </div>
    <div id="paneChat">
      <div class="bot"><span class="av">🤖</span><div><b>AI Store Builder</b><small>ئۆنلاین</small></div></div>
      <div id="msgs"></div>
    </div>
    <div id="paneView" hidden>
      <iframe id="frame" sandbox="" title="preview"></iframe>
      <div class="pub">
        <span>پێش بڵاوکردنەوە دەتوانیت هەر دەستکاری بکەیت.</span>
        <button type="button" id="pubBtn" disabled title="لە Phase 6 چالاک دەبێت">بڵاوکردنەوە</button>
      </div>
    </div>
    <div class="bar">
      <button class="ib" id="homeBtn" type="button" aria-label="پڕۆژەکان">⌂</button>
      <input id="editInput" maxlength="500" placeholder="داواکاری دەستکاری بنووسە..." autocomplete="off">
      <button class="send" id="sendBtn" type="button" aria-label="send">➤</button>
    </div>
  </section>
</main>

<!-- ADMIN SHEET -->
<div class="ov" id="adminOv"><div class="sheet">
  <button class="x" id="adminX" type="button">✕</button>
  <h3>سنووری ڕۆژانەی AI</h3>
  <label>بۆ هەموو بەکارهێنەران (ڕۆژانە)</label>
  <div class="row"><input id="globalLimit" type="number" min="0" max="1000"><button id="saveGlobal" type="button">پاشەکەوت</button></div>
  <label>بۆ یەک بەکارهێنەر</label>
  <select id="userSel"></select>
  <div class="row"><input id="userLimit" type="number" min="0" max="1000" placeholder="سنوور"><button id="saveUser" type="button">پاشەکەوت</button></div>
  <div class="note" id="adminNote"></div>
  <h3>داواکارییەکان (نوێترین)</h3>
  <div id="reqList" class="reqs"></div>
</div></div>

<div class="toast" id="toast"></div>
<script src="guard.js"></script>
<script src="ai-builder.js"></script>
</body>
</html>
