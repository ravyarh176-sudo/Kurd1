<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>پانێڵی سەرۆک | Kurd Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="chat.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

  <div class="bg"></div>

  <header class="topbar">
    <a class="brand" href="services.html">
      <span class="back-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l7 7-7 7"></path><path d="M21 12H3"></path></svg>
      </span>
      <span class="brand-title">پانێڵی سەرۆک</span>
    </a>
    <span class="owner-pill">⭐ خاوەنی وێبسایت</span>
  </header>

  <div class="top-tabs">
    <button type="button" class="top-tab active" id="topTabUsers">👥 بەکارهێنەران</button>
    <button type="button" class="top-tab" id="topTabSections">🗂️ بەڕێوەبردنی بەشەکان</button>
  </div>

  <main class="wrap" id="usersPanel">

    <div class="stats-row">
      <div class="stat-box">
        <b id="statTotal">–</b>
        <span>کۆی بەکارهێنەران</span>
      </div>
      <div class="stat-box">
        <b id="statBanned">–</b>
        <span>دەرکراو</span>
      </div>
      <div class="stat-box">
        <b id="statOwners">–</b>
        <span>خاوەن</span>
      </div>
    </div>

    <div class="section-title">هەموو بەکارهێنەران</div>
    <div class="user-list" id="userList">
      <div class="loading-hint">بارکردن...</div>
    </div>

  </main>

  <!-- ============ SECTIONS MANAGEMENT ============ -->
  <main class="wrap" id="sectionsPanel" hidden>
    <button type="button" class="btn-add-section" id="addSectionBtn">➕ بەشی نوێ زیاد بکە</button>

    <div class="section-title">بەشەکانی پەڕەی سەرەکی</div>
    <div class="sections-admin-list" id="sectionsList">
      <div class="loading-hint">بارکردن...</div>
    </div>
  </main>

  <!-- ============ User detail sheet ============ -->
  <div class="admin-overlay" id="userSheetOverlay">
    <div class="admin-sheet">
      <button type="button" class="admin-close" id="userSheetClose">✕</button>

      <div class="user-detail-head">
        <div class="user-detail-avatar" id="udAvatar">؟</div>
        <div class="user-detail-name" id="udName">—</div>
        <div class="user-detail-role" id="udRole">بەکارهێنەر</div>
      </div>

      <div class="admin-tabs">
        <button type="button" class="admin-tab active" data-tab="chat">چات</button>
        <button type="button" class="admin-tab" data-tab="manage">بەڕێوەبردن</button>
      </div>

      <div class="admin-tab-panel" id="tabChat">
        <div class="kc-panel" id="userChatMount" style="height:420px;"></div>
      </div>

      <div class="admin-tab-panel" id="tabManage" hidden>
        <div class="manage-block">
          <div class="manage-row">
            <span>دۆخی ئێستا</span>
            <b id="udStatus">چالاک</b>
          </div>

          <div class="field" id="banReasonField">
            <label>هۆکاری دەرکردن (ئارەزوومەندانە)</label>
            <textarea id="banReasonInput" rows="3" placeholder="بۆ نموونە: پێشێلکردنی یاساکان..."></textarea>
          </div>

          <button type="button" class="btn-ban" id="banToggleBtn">دەرکردن لە ماڵپەڕ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Add / Edit section sheet ============ -->
  <div class="admin-overlay" id="sectionFormOverlay">
    <div class="admin-sheet">
      <button type="button" class="admin-close" id="sectionFormClose">✕</button>
      <div class="section-form-title" id="sectionFormTitle">زیادکردنی بەشی نوێ</div>

      <div class="field">
        <label>ناوی بەش</label>
        <input id="sfTitle" type="text" placeholder="بۆ نموونە: هەلی کار">
      </div>
      <div class="field">
        <label>ناونیشانی کورت</label>
        <textarea id="sfDescription" rows="2" placeholder="ڕوونکردنەوەیەکی کورت..."></textarea>
      </div>
      <div class="field">
        <label>لینک (بەتاڵی بهێڵەوە یان "#" بۆ "بەم زووانە")</label>
        <input id="sfLink" type="text" placeholder="https:// ... یان cv-builder.html">
      </div>
      <div class="field">
        <label>لینکی وێنە (ئارەزوومەندانە)</label>
        <input id="sfImage" type="text" placeholder="https://...">
      </div>

      <div class="field">
        <label>ئایکۆن</label>
        <div class="icon-picker" id="iconPicker"></div>
      </div>

      <div class="field">
        <label>ڕەنگ و دیزاینی کارت</label>
        <div class="style-picker" id="stylePicker"></div>
      </div>
      <div class="field" id="customColorRow" hidden>
        <label>ڕەنگی خۆت هەڵبژێرە</label>
        <input id="sfCustomColor" type="color" value="#F5B800">
      </div>

      <label class="toggle-row" for="sfVisible">
        <span class="toggle-switch">
          <input id="sfVisible" type="checkbox" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
        <span class="toggle-text">بەشەکە لە پەڕەی سەرەکی پیشان بدرێت</span>
      </label>

      <button type="button" class="btn-save-section" id="sectionSaveBtn">پاشەکەوتکردن</button>
    </div>
  </div>

  <!-- ============ Generic confirm dialog ============ -->
  <div class="admin-overlay" id="confirmOverlay">
    <div class="admin-sheet confirm-sheet">
      <p id="confirmMessage">دڵنیایت؟</p>
      <div class="confirm-actions">
        <button type="button" class="confirm-yes" id="confirmYesBtn">بەڵێ، بیسڕەوە</button>
        <button type="button" class="confirm-no" id="confirmNoBtn">نەخێر</button>
      </div>
    </div>
  </div>

  <script src="guard.js"></script>
  <script src="chat.js"></script>
  <script src="admin.js"></script>
  <script src="sections-icons.js"></script>
  <script src="admin-sections.js"></script>
</body>
</html>
