<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>پانێڵی بەڕێوەبردن | Kurd Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="services-page admin-page">

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <header class="topbar">
    <div class="brand">
      <span class="sun">☀️</span>
      <span class="logo">Kurd Technology</span>
      <span class="badge-role badge-admin">پانێڵی سەرۆک</span>
    </div>
    <div class="user-chip">
      <div class="avatar" id="avatarLetter">؟</div>
      <div class="uinfo">
        <span class="uname" id="adminName">بەڕێوەبەر</span>
        <span class="urole" id="adminRole">سەرۆک</span>
      </div>
      <button class="btn-logout" id="logoutBtn" title="چوونەدەرەوە">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <main class="page-container admin-wrap">

    <div class="admin-top-actions">
      <a href="services.html" class="btn-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span>گەڕانەوە بۆ خزمەتگوزارییەکان</span>
      </a>
      <button class="btn-secondary" id="refreshUsersBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>نوێکردنەوە</span>
      </button>
    </div>

    <!-- ئامارەکان -->
    <div class="admin-stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="kpiTotalUsers">0</div>
        <div class="stat-lbl">سەرجەم بەکارهێنەران</div>
      </div>
      <div class="stat-box">
        <div class="stat-val text-green" id="kpiAdmins">0</div>
        <div class="stat-lbl">بەڕێوەبەران</div>
      </div>
      <div class="stat-box">
        <div class="stat-val text-red" id="kpiBanned">0</div>
        <div class="stat-lbl">بەندکراوەکان</div>
      </div>
    </div>

    <!-- خشتەی بەکارهێنەران -->
    <div class="service-card admin-table-card">
      <div class="table-header-row">
        <h2>بەکارهێنەرانی سیستم</h2>
        <div class="search-box">
          <input type="text" id="userSearch" placeholder="گەڕان بەپێی ناو یان ئیمەیڵ...">
        </div>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>بەکارهێنەر</th>
              <th>ڕۆڵ</th>
              <th>دۆخ</th>
              <th>بەرواری دروستبوون</th>
              <th>کردارەکان</th>
            </tr>
          </thead>
          <tbody id="usersTbody">
            <tr><td colspan="5" class="text-center text-muted">باردەکرێت...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="guard.js"></script>
  <script src="admin.js"></script>
</body>
</html>
