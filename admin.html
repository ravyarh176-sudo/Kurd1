<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>پانێڵی بەڕێوەبردن | Kurd Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>

  <div class="bg"></div>

  <!-- Top bar -->
  <header class="topbar">
    <a href="services.html" class="brand">
      <div class="back-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <span class="brand-title">Kurd Technology</span>
    </a>
    <span class="owner-pill">پانێڵی سەرۆک</span>
  </header>

  <!-- Main Wrap -->
  <main class="wrap">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <b id="statTotal">0</b>
        <span>سەرجەم بەکارهێنەران</span>
      </div>
      <div class="stat-box">
        <b id="statOwners" style="color: #4ADE80;">0</b>
        <span>خاوەنەکان</span>
      </div>
      <div class="stat-box">
        <b id="statBanned" style="color: #FF6B7A;">0</b>
        <span>دەرکراوەکان</span>
      </div>
    </div>

    <!-- User List -->
    <div class="section-title">بەکارهێنەرانی سیستم</div>
    <div class="user-list" id="userList">
      <div class="loading-hint">باردەکرێت...</div>
    </div>

  </main>

  <!-- User Detail & Chat Sheet Modal -->
  <div class="admin-overlay" id="userSheetOverlay">
    <div class="admin-sheet">
      <button class="admin-close" id="userSheetClose">✕</button>

      <div class="user-detail-head">
        <div class="user-detail-avatar" id="udAvatar">؟</div>
        <div class="user-detail-name" id="udName">ناو</div>
        <div class="user-detail-role" id="udRole">ڕۆڵ</div>
      </div>

      <!-- تابی چات و بەڕێوەبردن -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="chat">گفتوگۆ و دەنگ</button>
        <button class="admin-tab" data-tab="manage">بەڕێوەبردن و دۆخ</button>
      </div>

      <!-- پەڕەی گفتوگۆ (Chat & Voice) -->
      <div id="tabChat" class="admin-tab-panel">
        <div id="userChatMount" style="min-height: 280px;"></div>
      </div>

      <!-- پەڕەی بەڕێوەبردن (Ban) -->
      <div id="tabManage" class="admin-tab-panel" hidden>
        <div class="manage-block">
          <div class="manage-row">
            <span>دۆخی هەژمار:</span>
            <b id="udStatus">چالاکە</b>
          </div>

          <div class="field" style="margin-top: 10px;">
            <label>هۆکاری دەرکردن:</label>
            <textarea id="banReasonInput" placeholder="هۆکاری دەرکردن بنووسە..."></textarea>
          </div>

          <button class="btn-ban" id="banToggleBtn">دەرکردن لە ماڵپەڕ</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="guard.js"></script>
  <script src="chat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
